server:
  port: ${PORT:8083}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
user:
  service:
    url: ${USER_SERVICE_URL:http://localhost:8081}
product:
  service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
