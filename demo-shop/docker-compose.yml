services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build: ./user-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/userdb
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }

  product-service:
    build: ./product-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/productdb
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }

  order-service:
    build: ./order-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/orderdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
    ports: ["8083:8083"]
    depends_on:
      postgres: { condition: service_healthy }
      user-service: { condition: service_started }
      product-service: { condition: service_started }

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [user-service, product-service, order-service]

volumes:
  pgdata:
